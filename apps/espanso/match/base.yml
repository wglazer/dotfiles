# Managed by dotfiles.
matches:
  - trigger: ";mdash"
    replace: "—"
  - trigger: ";bullet"
    replace: "•"
  - trigger: ";warn"
    replace: "⚠️"
  - trigger: ";cross"
    replace: "✗"
  - trigger: ";check"
    replace: "✓"
  - trigger: ";lambda"
    replace: "λ"
  - trigger: ";theta"
    replace: "θ"
  - trigger: ";delta"
    replace: "Δ"
  - trigger: ";sum"
    replace: "∑"
  - trigger: ";sqrt"
    replace: "√"
  - trigger: ";inf"
    replace: "∞"
  - trigger: ";deg"
    replace: "°"
  - trigger: ";dots"
    replace: "…"
  - trigger: ";times"
    replace: "×"
  - trigger: ";pm"
    replace: "±"
  - trigger: ";ge"
    replace: "≥"
  - trigger: ";le"
    replace: "≤"
  - trigger: ";approx"
    replace: "≈"
  - trigger: ";ne"
    replace: "≠"
  - trigger: ";iff"
    replace: "⇔"
  - trigger: ";limplies"
    replace: "⇐"
  - trigger: ";implies"
    replace: "⇒"
  - trigger: ";lr"
    replace: "↔"
  - trigger: ";la"
    replace: "←"
  - trigger: ";ra"
    replace: "→"
